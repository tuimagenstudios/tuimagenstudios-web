name: Commerce security tests

on:
  pull_request:
    paths: ["commerce-api/**", ".github/workflows/security-tests.yml"]
  push:
    branches: [main]
    paths: ["commerce-api/**", ".github/workflows/security-tests.yml"]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: commerce-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: commerce-api/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - if: matrix.node == 24
        run: npm audit --omit=dev --audit-level=high
