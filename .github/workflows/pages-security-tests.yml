name: GitHub Pages security tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  pages-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/test/pages-security.test.mjs
