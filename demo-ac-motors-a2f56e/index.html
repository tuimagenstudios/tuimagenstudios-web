<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Azul · AC Motors</title>
<link rel="icon" href="logo-ac-motors.png">
<style>
  :root {
    --fondo: #0a0a0a; --panel: #1a1a1a; --chat: #0d0d0d; --yo: #4a4100; --bot: #222222;
    --texto: #f2f2f2; --suave: #9a9a9a; --acento: #ffe100; --borde: #2c2c2c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font-family: "Segoe UI", system-ui, sans-serif;
         height: 100vh; display: flex; justify-content: center; gap: 16px; padding: 16px; }
  .telefono { width: 420px; max-width: 100%; display: flex; flex-direction: column; background: var(--chat);
              border-radius: 14px; overflow: hidden; border: 1px solid var(--borde); }
  header { background: var(--panel); padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; display: block; }
  .marca { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-bottom: 14px;
           border-bottom: 1px solid var(--borde); }
  .marca img { width: 72px; height: 72px; }
  .marca b { display: block; color: var(--acento); font-size: 16px; letter-spacing: .5px; }
  .marca span { display: block; color: var(--suave); font-size: 12.5px; line-height: 1.5; }
  header { border-bottom: 2px solid var(--acento); }
  header b { display: block; } header small { color: var(--suave); }
  #chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 6px;
          background-image: radial-gradient(#ffe10010 1px, transparent 1px); background-size: 18px 18px; }
  .msg { max-width: 82%; padding: 7px 10px 8px; border-radius: 8px; line-height: 1.35; white-space: pre-wrap;
         font-size: 14.5px; }
  .yo { align-self: flex-end; background: var(--yo); }
  .bot { align-self: flex-start; background: var(--bot); }
  .escribiendo { color: var(--suave); font-style: italic; }
  .error { align-self: center; background: #5a1e1e; font-size: 13px; }
  .atajos { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 10px 0; background: var(--panel); }
  .atajos button { background: #2b2b2b; color: var(--texto); border: 0; border-radius: 14px; padding: 6px 10px;
                   font-size: 12.5px; cursor: pointer; }
  form { display: flex; gap: 8px; padding: 10px; background: var(--panel); }
  input { flex: 1; background: #2b2b2b; border: 0; border-radius: 20px; padding: 10px 14px; color: var(--texto);
          font-size: 15px; outline: none; }
  form button { background: var(--acento); color: #000; border: 0; border-radius: 50%; width: 42px; font-size: 18px;
                cursor: pointer; }
  aside { width: 340px; background: var(--panel); border-radius: 14px; padding: 14px; overflow-y: auto;
          border: 1px solid var(--borde); }
  aside h2 { font-size: 15px; margin: 0 0 4px; color: var(--acento); }
  aside p { color: var(--suave); font-size: 13px; margin: 0 0 12px; }
  aside pre { background: var(--fondo); padding: 10px; border-radius: 8px; font-size: 12.5px; white-space: pre-wrap; }
  .reiniciar { margin-top: 10px; background: transparent; color: var(--suave); border: 1px solid var(--borde);
               border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  @media (max-width: 800px) {
    body { padding: 0; height: auto; flex-direction: column; gap: 0; }
    .telefono { border-radius: 0; height: 100svh; border: 0; }
    aside { width: auto; border-radius: 0; border: 0; border-top: 2px solid var(--acento); }
  }
</style>
</head>
<body>
<div class="telefono">
  <header>
    <img class="avatar" src="logo-ac-motors.png" alt="AC Motors">
    <div><b>AC Motors · AC Taller</b><small>Asistente virtual · Prat Norte 0486, Azul</small></div>
  </header>
  <div id="chat"></div>
  <div class="atajos">
    <button>Hola, quería info</button>
    <button>Tengo un Gol 2012 que hace ruido al frenar, ¿me lo ven el lunes?</button>
    <button>¿Dan cursos para aprender desde cero?</button>
    <button>Me sale humo del capot y estoy en la autopista</button>
  </div>
  <form id="form">
    <input id="entrada" placeholder="Escribí un mensaje" autocomplete="off">
    <button aria-label="Enviar">➤</button>
  </form>
</div>
<aside>
  <div class="marca">
    <img src="logo-ac-motors.png" alt="">
    <div>
      <b>CHRISTIAN AYESTARAN</b>
      <span>Técnico electromecánico</span>
      <span>Prat Norte 0486 · 2281-461982</span>
    </div>
  </div>
  <h2>Pedidos para el taller</h2>
  <p>Resumen interno que el cliente no ve. Aparece cuando se cierra un pedido.</p>
  <div id="resumenes"><p>Todavía no hay pedidos.</p></div>
  <button class="reiniciar" id="reiniciar">Reiniciar conversación</button>
</aside>
<script>
  const API = "https://ac-motors-demo.tuimagenstudio.workers.dev/chat";
  const chat = document.getElementById("chat");
  const entrada = document.getElementById("entrada");
  let historial = [];
  let ocupado = false;

  function burbuja(texto, clase) {
    const d = document.createElement("div");
    d.className = "msg " + clase;
    d.textContent = texto;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  async function enviar(texto) {
    texto = texto.trim();
    if (!texto || ocupado) return;
    ocupado = true;
    burbuja(texto, "yo");
    historial.push({ role: "user", content: texto });
    const esperando = burbuja("Azul está escribiendo…", "bot escribiendo");
    try {
      const r = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ historial }),
      });
      const datos = await r.json();
      esperando.remove();
      if (datos.error) {
        historial.pop();
        burbuja(datos.error, "error");
      } else {
        historial.push({ role: "assistant", content: datos.mensajes.join("\n---\n") });
        for (const m of datos.mensajes) {
          burbuja(m, "bot");
          await new Promise(res => setTimeout(res, 450));
        }
        if (datos.resumen) mostrarResumen(datos.resumen);
      }
    } catch {
      esperando.remove();
      historial.pop();
      burbuja("No se pudo conectar con el servidor.", "error");
    }
    ocupado = false;
  }

  function mostrarResumen(texto) {
    const cont = document.getElementById("resumenes");
    if (cont.querySelector("p")) cont.innerHTML = "";
    const pre = document.createElement("pre");
    pre.textContent = texto;
    cont.prepend(pre);
  }

  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    enviar(entrada.value);
    entrada.value = "";
  });
  document.querySelectorAll(".atajos button").forEach(b => b.addEventListener("click", () => enviar(b.textContent)));
  document.getElementById("reiniciar").addEventListener("click", () => {
    historial = [];
    chat.innerHTML = "";
    document.getElementById("resumenes").innerHTML = "<p>Todavía no hay pedidos.</p>";
  });
</script>
</body>
</html>
