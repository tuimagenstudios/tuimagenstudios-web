  <style>
    :root { --noche: #05091a; --cian: #00e0ff; --texto: #f2f8ff; --tenue: #9ab0cd; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 32px 20px;
      background: var(--noche); color: var(--texto); font-family: Manrope, system-ui, sans-serif; text-align: center;
      overflow-x: hidden; position: relative;
    }
    body::before, body::after { content: ''; position: fixed; border-radius: 50%; filter: blur(90px); opacity: .55; pointer-events: none; }
    body::before { width: 520px; height: 520px; left: -160px; top: -180px; background: radial-gradient(circle, rgba(0, 224, 255, .6), transparent 70%); }
    body::after { width: 620px; height: 620px; right: -220px; bottom: -240px; background: radial-gradient(circle, rgba(46, 92, 255, .55), transparent 70%); }
    .grilla {
      position: fixed; inset: 0; pointer-events: none;
      background-image: linear-gradient(rgba(154, 176, 205, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(154, 176, 205, .07) 1px, transparent 1px);
      background-size: 48px 48px; mask-image: radial-gradient(ellipse at center, #000 35%, transparent 78%);
    }
    main { position: relative; max-width: 440px; animation: entrar .6s cubic-bezier(.2, .9, .3, 1); }
    .avatar {
      width: 168px; height: 168px; border-radius: 50%; display: block; margin: 0 auto 26px; object-fit: cover;
      box-shadow: 0 0 0 5px var(--cian), 0 0 60px rgba(0, 224, 255, .55);
    }
    .marca { font-size: 13px; letter-spacing: .14em; color: var(--cian); font-weight: 600; margin: 0 0 10px; }
    h1 { font-size: clamp(30px, 8vw, 40px); line-height: 1.08; letter-spacing: -.02em; margin: 0 0 14px; font-weight: 800; }
    h1 span { background: linear-gradient(90deg, var(--cian), #7fb4ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: var(--tenue); margin: 0 0 30px; font-size: 16px; line-height: 1.55; }
    .botones { display: grid; gap: 12px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 16px 22px; border-radius: 999px; font-weight: 800; font-size: 16px; text-decoration: none;
      transition: transform .15s, box-shadow .2s;
    }
    .btn svg { width: 22px; height: 22px; fill: currentColor; }
    .btn-wa { background: var(--cian); color: var(--noche); box-shadow: 0 12px 34px rgba(0, 224, 255, .4); }
    .btn-web { background: rgba(8, 18, 45, .8); color: var(--texto); border: 1px solid rgba(0, 224, 255, .45); }
    .btn:hover { transform: translateY(-2px); }
    .btn-wa:hover { box-shadow: 0 16px 42px rgba(0, 224, 255, .55); }
    .nota { font-size: 12.5px; margin: 22px 0 0; }
    .nota a { color: var(--tenue); }
    @keyframes entrar { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  </style>
</head>
